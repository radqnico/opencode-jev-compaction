services:
  # v1 harness (legacy): anomalyco/opencode fork, no v2 plugin system.
  # Kept for unit/matrix only. `load` step is a boot smoke test there.
  harness:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
    image: jev-harness:latest
    volumes:
      - ../src:/workspace/plugin/src:ro
      - ../tests:/workspace/plugin/tests:ro
      - ../package.json:/workspace/plugin/package.json:ro
      - ../package-lock.json:/workspace/plugin/package-lock.json:ro
      - ../tsconfig.json:/workspace/plugin/tsconfig.json:ro
      - ../.opencode:/workspace/plugin/.opencode:ro
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    command: ["all"]
    stdin_open: true
    tty: true

  # v2 harness (real): host-provided OpenCode v2 binary + node runtime.
  # The v2 binary is NOT published on GitHub/npm (CachyOS package only),
  # so it is injected at build time from /usr/bin/opencode on the host.
  # Build the image first (from repo root):
  #   mkdir -p /tmp/ocv2ctx && cp /usr/bin/opencode /tmp/ocv2ctx/opencode-v2 \
  #     && opencode --version > /tmp/ocv2ctx/opencode-version.txt \
  #     && docker build -f docker/Dockerfile.v2 --build-context v2bin=/tmp/ocv2ctx -t jev-v2:latest .
  # Then:
  #   docker compose -f docker/compose.yml run --rm v2 all
  v2:
    image: jev-v2:latest
    volumes:
      # NOTE: /tmp is deliberately NOT a shared volume — mkdtempSync dirs
      # must stay on the container's own filesystem for node_modules
      # symlinks inside them to resolve.
      - ../src:/workspace/plugin/src:ro
      - ../tests:/workspace/plugin/tests:ro
      - ../package.json:/workspace/plugin/package.json:ro
      - ../package-lock.json:/workspace/plugin/package-lock.json:ro
      - ../tsconfig.json:/workspace/plugin/tsconfig.json:ro
      - ../.opencode:/workspace/plugin/.opencode:ro
    environment:
      # No TYPESAFE_API_KEY by default: exercises the fallback path.
      # To test the live Jev path: TYPESAFE_API_KEY=... docker compose run v2 run
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    command: ["all"]
    stdin_open: true
    tty: true
